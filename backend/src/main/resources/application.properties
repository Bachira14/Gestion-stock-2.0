# ========================
#  Application
# ========================
spring.application.name=gestionstock
server.port=8080
server.address=0.0.0.0

# ========================
#  Base de données MySQL (Docker)
# ========================
# Host = nom du service MySQL dans docker-compose
spring.datasource.url=jdbc:mysql://localhost:3306/gestionstock?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Création / mise à jour automatique des tables
spring.jpa.hibernate.ddl-auto=update

# Afficher les requêtes SQL dans la console
spring.jpa.show-sql=true

# Formatage des requêtes SQL pour lisibilité
spring.jpa.properties.hibernate.format_sql=true

# ========================
#  JWT
# ========================
jwt.secret=MaCleSecreteTresSecurisee1234567890
jwt.expirationMs=3600000

# ========================
#  Logging
# ========================
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE # Très verbeux, à activer au besoin
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.com.gestionstock=DEBUG

# ========================
#  MVC / Routes
# ========================
spring.mvc.pathmatch.matching-strategy=ANT_PATH_MATCHER

# ========================
#  Upload de fichiers
# ========================
upload.path=../frontend/public/images
